name: linh-hoa-su
# Databases (MongoDB, Redis, MySQL) live in the shared platform stack (E:\platform-infra), not here, so this file
# never creates or recreates them. Connection settings come from `.env` (copy of E:\platform-infra\out\linhhoasu.env).
# First install on an empty database: `docker compose --profile seed run --rm seed-mongo` and `... seed-mysql`.
services:
  game:
    build: ./data/lhs/newServer
    env_file: ./docker/game.env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_USER:?copy platform out/linhhoasu.env to .env}:${DB_PASSWORD:?}@infra-mongo:27017/lhs_s1001?authSource=admin&replicaSet=rs0
      MONGO_CONNECT_RETRIES: '90'
      REDIS_HOST: infra-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_PREFIX: 's1001:'
      DIST_BASE_URL: http://dist:3001
      CONFIG_BIN_PATH: /seed/config_e5ac72c2.bin
      HTTP_PORT: '8080'
      AGENT_HTTP_PORT: '0'
      WS_PORT: '9200'
      WS_HOST: 0.0.0.0
      WS_BEHIND_PROXY: '1'
      WS_PUBLIC_PORT: '18081'
      WS_PUBLIC_PATH: /ws
      REGISTER_PUBLIC_PORT: '18081'
      SERVER_ID: '1001'
      SERVER_NAME: S1
      REQUIRE_INVITE_REGISTER: '0'
      # Login hardening: no passwordless SDKAuth fallback, no silent auto-registration, no tokenless WS login.
      SDK_AUTH_PASSWORD_STRICT: '1'
      ALLOW_AUTO_REGISTER: '0'
      # Platform SSO + wallet credit (values from .env; the platform API runs on the Windows host in dev).
      PLATFORM_URL: http://host.docker.internal:3100
      PLATFORM_GAME_ID: ${PLATFORM_GAME_ID:?}
      PLATFORM_SECRET: ${PLATFORM_SECRET:?}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/lhs/update/resource/assets/excel/config_e5ac72c2.bin:/seed/config_e5ac72c2.bin:ro
      - ./docker/configMap,json:/configMap,json
    networks: [default, platform-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  dist:
    build: ./data/lhs/LHS-dist
    env_file: ./data/lhs/LHS-dist/.env
    environment:
      NODE_ENV: development
      PORT: '3001'
      MONGODB_URI: mongodb://${MONGO_USER:?}:${DB_PASSWORD:?}@infra-mongo:27017/lhs_dist?authSource=admin&replicaSet=rs0
      MONGO_CONNECT_RETRIES: '90'
    networks: [default, platform-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  admin:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./data/lhs/LHS-admin:/app:ro
    command: ["node", "server.js"]
    environment:
      LHS_ADMIN_PORT: '8082'
      GAME_ADMIN_ORIGIN: http://game:8080
      DIST_ADMIN_ORIGIN: http://dist:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    volumes:
      - ./www/wwwroot/game:/var/www/game:ro
      - ./docker/php-config.php:/var/www/game/ht/config/config.php:ro
    environment:
      LHS_DB_PASSWORD: ${DB_PASSWORD:?}
    networks: [default, platform-net]
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./www/wwwroot/game:/var/www/game:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params_lhs:/etc/nginx/proxy_params_lhs:ro
    depends_on:
      game: {condition: service_healthy}
      dist: {condition: service_healthy}
      admin: {condition: service_healthy}
      php: {condition: service_started}
    restart: unless-stopped

  # One-off seeding of an empty shared database (never overwrites existing data). Not started by `up`.
  seed-mongo:
    profiles: [seed]
    image: mongo:7.0
    environment:
      LHS_MONGO: mongodb://${MONGO_USER:?}:${DB_PASSWORD:?}@infra-mongo:27017/?authSource=admin&replicaSet=rs0
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/init/mongo-defaults.js:/seed-defaults/mongo-defaults.js:ro
      - ./docker/seed-shared-mongo.sh:/seed-shared-mongo.sh:ro
    command: ["bash", "/seed-shared-mongo.sh"]
    networks: [platform-net]
  seed-mysql:
    profiles: [seed]
    image: mysql:5.7
    environment:
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PWD: ${DB_PASSWORD:?}
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/init/mysql-schema.sql:/schema.sql:ro
      - ./docker/seed-shared-mysql.sh:/seed-shared-mysql.sh:ro
    entrypoint: ["bash", "/seed-shared-mysql.sh"]
    networks: [platform-net]

networks:
  platform-net:
    external: true
