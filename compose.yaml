name: linh-hoa-su
services:
  mongo:
    image: mongo:7.0
    volumes:
      - ./docker/data/mongo:/data/db
      - ./docker/seed:/seed:ro
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - ./docker/init/mongo-defaults.js:/seed-defaults/mongo-defaults.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    volumes:
      - redis-data:/data
      - ./docker/seed:/seed:ro
    command: ["sh", "-c", "if [ ! -f /data/dump.rdb ] && [ -f /seed/redis-dump.rdb ]; then cp /seed/redis-dump.rdb /data/dump.rdb; fi; exec redis-server --dir /data --appendonly yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/seed:/seed:ro
      - ./docker/init/mysql-init.sh:/docker-entrypoint-initdb.d/10-cdk.sh:ro
      - ./docker/init/mysql-schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  game:
    build: ./data/lhs/newServer
    env_file: ./docker/game.env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/lhs_s1001
      MONGO_CONNECT_RETRIES: '90'
      REDIS_HOST: redis
      REDIS_PREFIX: 's1001:'
      DIST_BASE_URL: http://dist:3001
      CONFIG_BIN_PATH: /seed/config_e5ac72c2.bin
      HTTP_PORT: '8080'
      AGENT_HTTP_PORT: '0'
      WS_PORT: '9200'
      WS_HOST: 0.0.0.0
      WS_BEHIND_PROXY: '1'
      WS_PUBLIC_PORT: '18081'
      WS_PUBLIC_PATH: /ws
      REGISTER_PUBLIC_PORT: '18081'
      SERVER_ID: '1001'
      SERVER_NAME: S1
      REQUIRE_INVITE_REGISTER: '0'
    volumes:
      - ./data/lhs/update/resource/assets/excel/config_e5ac72c2.bin:/seed/config_e5ac72c2.bin:ro
      - ./docker/configMap,json:/configMap,json
    depends_on:
      mongo: {condition: service_healthy, restart: true}
      redis: {condition: service_healthy, restart: true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  dist:
    build: ./data/lhs/LHS-dist
    env_file: ./data/lhs/LHS-dist/.env
    environment:
      NODE_ENV: development
      PORT: '3001'
      MONGODB_URI: mongodb://mongo:27017/lhs_dist
      MONGO_CONNECT_RETRIES: '90'
    depends_on:
      mongo: {condition: service_healthy, restart: true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  admin:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./data/lhs/LHS-admin:/app:ro
    command: ["node", "server.js"]
    environment:
      LHS_ADMIN_PORT: '8082'
      GAME_ADMIN_ORIGIN: http://game:8080
      DIST_ADMIN_ORIGIN: http://dist:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    volumes:
      - ./www/wwwroot/game:/var/www/game:ro
      - ./docker/php-config.php:/var/www/game/ht/config/config.php:ro
    depends_on:
      mysql: {condition: service_healthy}
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./www/wwwroot/game:/var/www/game:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params_lhs:/etc/nginx/proxy_params_lhs:ro
    depends_on:
      game: {condition: service_healthy}
      dist: {condition: service_healthy}
      admin: {condition: service_healthy}
      php: {condition: service_started}
    restart: unless-stopped
volumes:
  redis-data:
  mysql-data:
