<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống phân phối Linh Họa Sư</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Đang tải...</span>
    </div>
  </div>

  <!-- 登录容器 -->
  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <h1 class="login-title">Hệ thống phân phối Linh Họa Sư</h1>
        <p class="login-subtitle">Nền tảng quản lý đại lý</p>
      </div>

      <div class="btn-group w-100 mb-4" role="group">
        <button type="button" class="btn btn-primary" id="loginTab">Đăng nhập</button>
        <button type="button" class="btn btn-outline-primary" id="registerTab">Đăng ký</button>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Tên đăng nhập</label>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            id="username" 
            placeholder="Nhập tên đăng nhập"
            required
          >
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Mật khẩu</label>
          <input 
            type="password" 
            class="form-control form-control-lg" 
            id="password" 
            placeholder="Nhập mật khẩu"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          Đăng nhập
        </button>
      </form>

      <div id="loggedInPanel" class="alert alert-info mt-3" style="display: none;">
        <div id="loggedInText" class="mb-2"></div>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary" id="enterBackendBtn">Vào trang quản trị</button>
          <button type="button" class="btn btn-outline-secondary" id="switchAccountBtn">Chuyển tài khoản</button>
        </div>
      </div>

      <form id="registerForm" style="display: none;">
        <div class="mb-3">
          <label for="regUsername" class="form-label">Tên đăng nhập</label>
          <input type="text" class="form-control form-control-lg" id="regUsername" placeholder="Tên đăng nhập từ 3 đến 20 ký tự" required>
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Mật khẩu</label>
          <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Mật khẩu có ít nhất 6 ký tự" required>
        </div>
        <div class="mb-3">
          <label for="regPhone" class="form-label">Số điện thoại (Telegram)</label>
          <input type="tel" class="form-control form-control-lg" id="regPhone" placeholder="Không bắt buộc, dùng để liên hệ">
        </div>
        <div class="mb-4">
          <label for="parentInviteCode" class="form-label">Mã mời</label>
          <input type="text" class="form-control form-control-lg" id="parentInviteCode" maxlength="6" placeholder="Nhập mã mời của đại lý cấp trên" required>
          <small class="text-muted" id="inviteHint">Vui lòng truy cập bằng liên kết mời của đại lý cấp trên hoặc tự nhập mã mời</small>
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100">
          Đăng ký tài khoản đại lý
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">
          Chưa có tài khoản? Hãy liên hệ đại lý cấp trên để nhận liên kết mời
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    const inviteCodeFromUrl = (query.get('inviteCode') || query.get('invite') || query.get('code') || '').trim().toUpperCase();

    function switchAuthMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
      document.getElementById('loginTab').className = isLogin ? 'btn btn-primary' : 'btn btn-outline-primary';
      document.getElementById('registerTab').className = isLogin ? 'btn btn-outline-primary' : 'btn btn-primary';
    }

    document.getElementById('loginTab').addEventListener('click', () => switchAuthMode('login'));
    document.getElementById('registerTab').addEventListener('click', () => switchAuthMode('register'));

    if (inviteCodeFromUrl) {
      document.getElementById('parentInviteCode').value = inviteCodeFromUrl;
      document.getElementById('parentInviteCode').readOnly = true;
      document.getElementById('inviteHint').textContent = `Đã nhận diện mã mời: ${inviteCodeFromUrl}`;
      switchAuthMode('register');
    }

    // 登录页始终允许重新输入账号，避免同一浏览器沿用上一次代理后台身份。
    async function initLoggedInPanel() {
      if (!Auth.isLoggedIn()) {
        return;
      }

      const user = await Auth.getCurrentUser();
      if (!user) {
        api.clearToken();
        return;
      }

      document.getElementById('loggedInText').textContent = `Đang đăng nhập: ${user.username}, bạn có thể vào trang quản trị tương ứng.`;
      document.getElementById('loggedInPanel').style.display = '';
      document.getElementById('enterBackendBtn').onclick = () => Auth.redirectToHome(user);
      document.getElementById('switchAccountBtn').onclick = () => {
        api.clearToken();
        document.getElementById('loggedInPanel').style.display = 'none';
        document.getElementById('username').focus();
      };
    }

    initLoggedInPanel();

    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      showLoading();

      try {
        const response = await api.login(username, password);
        
        if (response.success) {
          showToast('Đăng nhập thành công!', 'success');
          setTimeout(() => {
            Auth.redirectToHome(response.data.agent);
          }, 500);
        } else {
          showToast(response.message || 'Đăng nhập thất bại', 'danger');
        }
      } catch (error) {
        showToast(error.message || 'Đăng nhập thất bại, vui lòng kiểm tra tên đăng nhập và mật khẩu', 'danger');
      } finally {
        hideLoading();
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const phone = document.getElementById('regPhone').value.trim();
      const parentInviteCode = document.getElementById('parentInviteCode').value.trim().toUpperCase();

      if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
        showToast('Số điện thoại không đúng định dạng', 'danger');
        return;
      }
      if (!/^[A-Za-z0-9]{6}$/.test(parentInviteCode)) {
        showToast('Mã mời phải gồm 6 chữ cái hoặc chữ số', 'danger');
        return;
      }

      showLoading();
      try {
        const response = await api.registerAgent({ username, password, phone, parentInviteCode });
        if (response.success) {
          showToast(response.message || 'Đã gửi yêu cầu đăng ký, vui lòng chờ đại lý cấp trên duyệt', 'success');
          document.getElementById('username').value = username;
          switchAuthMode('login');
        } else {
          showToast(response.message || 'Đăng ký thất bại', 'danger');
        }
      } catch (error) {
        showToast(error.message || 'Đăng ký thất bại, vui lòng kiểm tra thông tin', 'danger');
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>
