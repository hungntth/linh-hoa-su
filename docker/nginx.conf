server {
 listen 80;
 server_name _;
 root /var/www/game;
 index index.html index.php;
 location = /gameMsg.do { proxy_pass http://game:8080; include /etc/nginx/proxy_params_lhs; }
 location /api/ { proxy_pass http://game:8080; include /etc/nginx/proxy_params_lhs; }
 location /ws { proxy_pass http://game:9200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 3600s; }
 location /admin/ { proxy_pass http://admin:8082/; include /etc/nginx/proxy_params_lhs; }
 location /dist-api/ { proxy_pass http://dist:3001/; include /etc/nginx/proxy_params_lhs; }
 location /dist/ { proxy_pass http://dist:3001/; include /etc/nginx/proxy_params_lhs; }
 location ~ \.php$ { try_files $uri =404; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass php:9000; }
 location / { try_files $uri $uri/ /index.html; }
}
