server {
 listen 80;
 server_name _;
 root /var/www/game;
 index index.html index.php;
 # Docker DNS: resolve container names per request so restarted containers with new IPs stay reachable.
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $up_game game;
 set $up_admin admin;
 set $up_dist dist;
 set $up_php php;
 location = /gameMsg.do { proxy_pass http://$up_game:8080; include /etc/nginx/proxy_params_lhs; }
 location /api/ { proxy_pass http://$up_game:8080; include /etc/nginx/proxy_params_lhs; }
 # Platform -> game wallet credit (HMAC-signed by the platform; see newServer/src/platform/platformCredit.js).
 location /internal/platform/ { proxy_pass http://$up_game:8080; include /etc/nginx/proxy_params_lhs; }
 location /ws { proxy_pass http://$up_game:9200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 3600s; }
 location /admin/ { rewrite ^/admin/(.*)$ /$1 break; proxy_pass http://$up_admin:8082; include /etc/nginx/proxy_params_lhs; }
 location /dist-api/ { rewrite ^/dist-api/(.*)$ /$1 break; proxy_pass http://$up_dist:3001; include /etc/nginx/proxy_params_lhs; }
 location /dist/ { rewrite ^/dist/(.*)$ /$1 break; proxy_pass http://$up_dist:3001; include /etc/nginx/proxy_params_lhs; }
 location ~ \.php$ { try_files $uri =404; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass $up_php:9000; }
 location / { try_files $uri $uri/ /index.html; }
}
